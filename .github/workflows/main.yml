name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Stage: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Tool Configuration: Setup Java and Maven caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Stage: Build
      - name: Build with Maven
        run: mvn clean package

      # Post Action: Success (Archive Artifacts)
      - name: Archive Production Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar
          if-no-files-found: error

      # Stage: Deploy (Runs in background)
      - name: Deploy Application
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          sleep 5 # Gives the background process a moment to initialize
          cat app.log

      # Post Action: Success (Send Email Notification)
      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Testing my Jenkins
          to: learningonly092@gmail.com
          from: GitHub Actions CI
          body: This is for my personal testing.. Hi Hi ha ha hu hu.. from github actions

      # Post Action: Failure (Send Email Notification)
      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'ALARM: Github actions Build Failed'
          to: learningonly092@gmail.com
          from: GitHub Actions CI
          body: GITHUB actions failed! Please check the terminal logs.
